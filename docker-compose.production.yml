services:
  app:
    build:
      context: ./backend
    env_file:
      - .env.production
    depends_on:
      - postgres
      - redis
      - minio
      - livekit
    volumes:
      - ./data/geoip:/app/data/geoip:ro
    restart: unless-stopped

  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-bookworm
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-12-13T22-19-12Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.8
    command: ["--dev", "--bind", "0.0.0.0", "--keys", "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"]
    restart: unless-stopped

  nginx:
    image: nginx:1.27-bookworm
    env_file:
      - .env.production
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/templates:/etc/nginx/templates:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
